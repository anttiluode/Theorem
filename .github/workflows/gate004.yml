name: Theorem Gate 004 - No-reset temporal candidate-directed probes

on:
  push:
    paths:
      - 'temporal_gate.py'
      - 'tests/test_temporal_gate.py'
      - '.github/workflows/gate004.yml'
  pull_request:
  workflow_dispatch:

jobs:
  temporal-identification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU numeric test dependencies
        run: python -m pip install numpy pytest
      - name: Run all 30 numerical, alias and null tests
        run: python -m pytest -q
      - name: Fresh offset, null and process sweeps
        run: python -m temporal_gate --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theorem-gate-004-temporal-results
          path: |
            results/gate004.json
            results/gate004.md
          if-no-files-found: warn
